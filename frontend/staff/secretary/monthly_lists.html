<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secretary - Monthly Lists</title>
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <header class="topbar">
    <h1>Secretary - Monthly Contribution Lists</h1>
    <div class="topbar-right">
      <span id="welcome"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="dashboard">
    <p id="error-message" class="error"></p>

    <section class="table-section">
      <h2>Select a Month</h2>
      <select id="month-picker">
        <option value="">-- choose a month --</option>
      </select>
      <p id="no-months" class="empty-note" style="display:none;">
        No months with contribution activity yet.
      </p>
    </section>

    <section class="table-section" id="list-section" style="display:none;">
      <h2 id="month-title"></h2>
      <p class="big-number">Month total: KES <span id="month-total">0</span></p>
      <table id="members-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Amount Paid</th>
            <th>Date Paid</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="table-section" id="penalty-section" style="display:none;">
      <h2>Members Charged the 10% Fee</h2>
      <table id="penalties-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Penalty Amount</th>
            <th>Date Charged</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="no-penalties" class="empty-note" style="display:none;">
        No penalties charged for this month.
      </p>
    </section>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/secretary.js"></script>
</body>
</html>
