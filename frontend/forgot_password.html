<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Nyikwa Abiya Welfare</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/reset.css">
</head>
<body class="reset-page">

  <!-- Success notice, shown at the top of the window only after a successful change -->
  <div id="success-toast" class="toast" role="status" aria-live="polite" hidden>
    <span class="toast-icon">&#10003;</span>
    <span class="toast-text">Password changed successfully</span>
    <button type="button" id="toast-close" class="toast-close" aria-label="Close">&times;</button>
  </div>

  <div class="auth-container">
    <h2 id="page-title">Reset Your Password</h2>
    <p id="error-message" class="error" role="alert"></p>
    <p id="info-message" class="success" role="status"></p>

    <!-- Screen 1: username, contacts, code -->
    <form id="request-screen" novalidate>
      <label for="reset-username">Username</label>
      <input type="text" id="reset-username" autocomplete="username" autocapitalize="off" spellcheck="false">
      <p id="lookup-status" class="lookup-status"></p>

      <div id="contact-list" class="contact-list" hidden></div>

      <button type="button" id="send-btn" class="button-orange" hidden disabled>Send code</button>

      <div id="code-box" class="code-box" hidden>
        <p id="code-sent-to" class="code-sent-to"></p>
        <label for="reset-code">6-digit code</label>
        <input type="text" id="reset-code" class="code-input" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code">
        <p id="code-message" class="code-message" role="alert"></p>
        <p id="countdown" class="countdown"></p>
        <button type="submit" id="verify-btn">Verify code</button>
        <button type="button" id="resend-btn" class="button-orange">Resend code</button>
      </div>
    </form>

    <!-- Screen 2: the new password -->
    <form id="password-screen" novalidate hidden>
      <label for="new-password">New password</label>
      <input type="password" id="new-password" autocomplete="new-password">
      <small class="field-error" id="error-new_password"></small>

      <label for="new-password2">Confirm new password</label>
      <input type="password" id="new-password2" autocomplete="new-password">
      <small class="field-error" id="error-new_password2"></small>

      <p class="hint">At least 8 characters, not too similar to your name or username, and not only numbers.</p>
      <button type="submit" id="password-btn">Change password</button>
    </form>

    <!-- Screen 3: after a successful change -->
    <div id="done-screen" hidden>
      <p class="done-text">You can now log in with your new password. For your safety, you have been logged out on every other device.</p>
      <a href="login.html" class="button-link">Go to login</a>
    </div>

    <p><a href="login.html">Back to login</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
